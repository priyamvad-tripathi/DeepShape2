# Visibility parameters
frequency: 1.4e9  # Hz
integration_time: 300 # seconds
ha_interval: [-4, 4] # hours

# Pixel scale
# SCALE_RADIANS: 6.93e-07
SCALE_RADIANS: 1.4544e-06 # 0.3 arcsec/pixel for ILT

# Sky centre
# RA0 : 56.0
# DEC0 : -30.0
DEC0: 55
RA0: 243


# Sky Simulation
NPIX_SKY: 25200   # Number of pixels along one axis of the sky model
FFTBIGSIZE: 81488 # GalSim FFTBIG parameter

# Scale factor for image deblending
SCALE_FACTOR: 5e7

# VAE parameters
VAE_beta: 1e-4 # KL Divergence weight for VAE
VAE_lr_init: 1e-4 # Initial learning rate for VAE


# HQS_PnP Hyperparameters
hqs_hyperparams:
  niter: 30
  SIGMA: 0.71e-06
  f1: 0.38046931731218053
  f2: 3.7035096781994907
  falpha: 3.1097160530212475

# TQDM parameters
tqdm:
  ncols: 200
  dynamic_ncols: false
  smoothing: 0.1
  colour: "green"
  ascii: True
  unit: "batch"
  
# Paths
LOCAL_DIR:  "${path:/scratch/tripathi/}"
RESULTS_DIR: "${path:/home/tripathi/DeepShape2/results/}"
TRECS_DIR:  "${path:/scratch/tripathi/TRECS/}"
GENCI_DIR:  "${path:/lustre/fswork/projects/rech/klu/uyt81gs/}"
RLF_DIR:    "${path:/home/tripathi/RadioLensfit2/}"

# Models
MODELS:
  deblender:
    class: VAE
    weights: "vae_mha.pt"

  shapenet:
    class: shapenet_full
    weights: "shape_network_full.pt"