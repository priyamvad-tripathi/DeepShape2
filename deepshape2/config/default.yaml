# Visibility parameters
frequency: 1.4e9  # Hz
integration_time: 300 # seconds
ha_interval: [-4, 4] # hours

# Pixel scale
SCALE_RADIANS: 6.93e-07

# Sky centre
RA0 : 56.0
DEC0 : -30.0

# Sky Simulation
NPIX_SKY: 25200   # Number of pixels along one axis of the sky model
FFTBIGSIZE: 81488 # GalSim FFTBIG parameter

# Scale factor for image deblending
SCALE_FACTOR: 5e7

# VAE parameters
VAE_beta: 1e-4 # KL Divergence weight for VAE
VAE_lr_init: 1e-4 # Initial learning rate for VAE


# HQS_PnP Hyperparameters
hqs_hyperparams:
  niter: 30
  SIGMA: 0.71e-06
  f1: 0.2076320305146005
  f2: 8.855988804161978
  falpha: 5.052044590041307

# TQDM parameters
tqdm:
  ncols: 200
  dynamic_ncols: false
  smoothing: 0.1
  colour: "green"
  ascii: True
  unit: "batch"
  
# Paths
LOCAL_DIR: "/scratch/tripathi/DS2/"
RESULTS_DIR: "/home/tripathi/DeepShape2/results/"
TRECS_DIR: "/scratch/tripathi/TRECS/"
